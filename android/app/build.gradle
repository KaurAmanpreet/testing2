plugins {
    id 'com.android.application'
}

// The web app lives at the repo root (index.html). Copy it into the APK's assets at build time
// so the Android app and the browser version never drift apart.
def webAssetsDir = layout.buildDirectory.dir("generated/webassets")
def copyWebApp = tasks.register('copyWebApp', Copy) {
    from(rootProject.file('../index.html'))
    into(webAssetsDir)
}

android {
    namespace 'com.ledger.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ledger.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += webAssetsDir
    }
}

tasks.named('preBuild') { dependsOn copyWebApp }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
